name: CI — Python Workers

on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - '.github/workflows/ci-python.yml'
  pull_request:
    branches: [main]
    paths:
      - 'python/**'
      - '.github/workflows/ci-python.yml'

permissions:
  contents: read

jobs:
  lint-test-parser:
    name: Parser Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/parser-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python/parser-worker/requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Test
        run: pytest

  lint-test-render:
    name: Render Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/render-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python/render-worker/requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Test
        run: pytest
