name: CI — Infra (Bicep)

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/ci-infra.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/ci-infra.yml'

permissions:
  contents: read

jobs:
  bicep-lint:
    name: Bicep Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Bicep lint — main
        run: az bicep lint --file infra/main.bicep

      - name: Bicep lint — modules
        run: |
          for f in infra/modules/*.bicep; do
            echo "Linting $f"
            az bicep lint --file "$f"
          done
